# Verification service: the relying-party facing API. Stateless -- it delegates
# appraisal to VTS over gRPC -- so it scales horizontally.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verification
  namespace: veraison
  labels:
    app.kubernetes.io/name: verification
    app.kubernetes.io/part-of: veraison
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: verification
  template:
    metadata:
      labels:
        app.kubernetes.io/name: verification
        app.kubernetes.io/part-of: veraison
    spec:
      containers:
        - name: verification
          image: veraison/verification:latest
          imagePullPolicy: IfNotPresent
          args: ["/opt/veraison/verification-service"]
          ports:
            - name: https
              containerPort: 8443
          volumeMounts:
            - name: config
              mountPath: /opt/veraison/config.yaml
              subPath: config.yaml
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: veraison-config
---
apiVersion: v1
kind: Service
metadata:
  name: verification-service
  namespace: veraison
spec:
  selector:
    app.kubernetes.io/name: verification
  ports:
    - name: https
      port: 8443
      targetPort: 8443
