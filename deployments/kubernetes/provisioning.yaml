# Provisioning service: accepts endorsements/trust anchors and forwards them to
# VTS over gRPC. It holds no local state, so it scales horizontally.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provisioning
  namespace: veraison
  labels:
    app.kubernetes.io/name: provisioning
    app.kubernetes.io/part-of: veraison
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: provisioning
  template:
    metadata:
      labels:
        app.kubernetes.io/name: provisioning
        app.kubernetes.io/part-of: veraison
    spec:
      containers:
        - name: provisioning
          image: veraison/provisioning:latest
          imagePullPolicy: IfNotPresent
          args: ["/opt/veraison/provisioning-service"]
          ports:
            - name: https
              containerPort: 9443
          volumeMounts:
            - name: config
              mountPath: /opt/veraison/config.yaml
              subPath: config.yaml
          readinessProbe:
            tcpSocket:
              port: 9443
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9443
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: veraison-config
---
apiVersion: v1
kind: Service
metadata:
  name: provisioning-service
  namespace: veraison
spec:
  selector:
    app.kubernetes.io/name: provisioning
  ports:
    - name: https
      port: 9443
      targetPort: 9443
