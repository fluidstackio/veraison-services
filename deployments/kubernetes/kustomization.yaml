apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: veraison

resources:
  - namespace.yaml
  - configmap-config.yaml
  - vts.yaml
  - provisioning.yaml
  - verification.yaml
  - coserv.yaml
  - keycloak.yaml

# The manifests reference the image names that deployments/docker/Makefile
# produces locally. Retag/push them and override the registry here rather than
# editing each Deployment, e.g.
#
#   kustomize edit set image veraison/vts=registry.example.com/veraison/vts:v0.0.2609
#
# Set newTag on all six together so a deployment is never a mix of versions.
#
# Local builds are tagged per architecture (:amd64, :arm64) because the Makefile
# reuses :latest for whichever it built last -- so "latest" here means "whatever
# was built last", which is not what you want to deploy from. Pin an explicit
# arch tag for a single-architecture cluster, or push a multi-arch manifest and
# use one tag for both (see README.md).
images:
  - name: veraison/vts
    newTag: latest
  - name: veraison/management
    newTag: latest
  - name: veraison/provisioning
    newTag: latest
  - name: veraison/verification
    newTag: latest
  - name: veraison/coserv
    newTag: latest
  - name: veraison/keycloak
    newTag: latest
